    <script>
        const APP_PREFIX = 'manualescam_';
        const DB_NAME = 'ManualesCamDB_v7'; 
        const DB_VERSION = 5;

        class ManualesCamApp {
            constructor() {
                this.db = null;
                this.stream = null;
                this.photos = [];
                this.facingMode = 'environment';
                this.flashMode = 'off';
                this.hdMode = false;
                
                this.dirHandle = null;
                this.session = { code: '', type: 'Pedido', phrase: 'entregado correctamente' };
                
                // Scanner
                this.scannerStream = null;
                this.scannedCode = null;
                this.isScanning = false;

                // Voice
                this.recognition = null;
                this.isListening = false;

                // Zoom & Swipe
                this.currentZoom = 1;
                this.initialDistance = null;
                this.fsUrls = [];
                this.fsIndex = 0;
                this.touchStartX = 0;

                // Motor Sonido
                this.audioCtx = null;

                this.init();
            }

            async init() {
                this.setupPWA();
                await this.initDB();
                this.loadInputsFromStorage();
                this.setupZoomListeners();
                this.setupSwipeListeners();
                
                await this.checkAndRestorePendingSession();
                this.renderPendingSessions();
            }

            setupPWA() {
                try {
                    const createIcon = (size) => {
                        const c = document.createElement('canvas');
                        c.width = size;
                        c.height = size;
                        const ctx = c.getContext('2d');
                        ctx.scale(size / 100, size / 100);

                        ctx.fillStyle = '#0F3C88';
                        ctx.beginPath();
                        ctx.roundRect(0, 0, 100, 100, 22.5);
                        ctx.fill();

                        ctx.strokeStyle = '#FFFFFF';
                        ctx.lineWidth = 6;
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        ctx.moveTo(25, 35);
                        ctx.lineTo(37, 35);
                        ctx.lineTo(42, 27);
                        ctx.lineTo(58, 27);
                        ctx.lineTo(63, 35);
                        ctx.lineTo(75, 35);
                        ctx.arcTo(83, 35, 83, 43, 8);
                        ctx.lineTo(83, 67);
                        ctx.arcTo(83, 75, 75, 75, 8);
                        ctx.lineTo(25, 75);
                        ctx.arcTo(17, 75, 17, 67, 8);
                        ctx.lineTo(17, 43);
                        ctx.arcTo(17, 35, 25, 35, 8);
                        ctx.closePath();
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(50, 52, 14, 0, Math.PI * 2);
                        ctx.stroke();

                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(75, 43, 3.5, 0, Math.PI * 2);
                        ctx.fill();

                        return c.toDataURL('image/png');
                    };

                    const icon192 = createIcon(192);
                    const icon512 = createIcon(512);

                    const appleIcon = document.getElementById('apple-touch-icon');
                    if (appleIcon) appleIcon.href = icon192;

                    const manifest = {
                        name: 'Manuales Cam Pro',
                        short_name: 'Manuales Cam',
                        description: 'Registro Profesional de Evidencias',
                        start_url: window.location.href.split('#')[0],
                        scope: window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1),
                        display: 'standalone',
                        orientation: 'portrait',
                        background_color: '#F0F4F8',
                        theme_color: '#0F3C88',
                        icons: [
                            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
                            { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
                            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
                            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
                        ]
                    };

                    const manifestEl = document.getElementById('pwa-manifest');
                    if (manifestEl) {
                        manifestEl.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
                    }
                } catch (e) {}
            }

            // --- AUDIO Y VIBRACIÓN (HAPTICS) ---
            initAudio() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            }

            playSound(type) {
                try {
                    this.initAudio();
                    const now = this.audioCtx.currentTime;

                    if (type === 'shutter') {
                        const bufferSize = Math.floor(this.audioCtx.sampleRate * 0.09);
                        const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                        const output = noiseBuffer.getChannelData(0);
                        for (let i = 0; i < bufferSize; i++) {
                            output[i] = Math.random() * 2 - 1;
                        }

                        // Apertura del obturador
                        const noise1 = this.audioCtx.createBufferSource();
                        noise1.buffer = noiseBuffer;
                        const filter1 = this.audioCtx.createBiquadFilter();
                        filter1.type = 'bandpass';
                        filter1.frequency.setValueAtTime(1800, now);
                        filter1.Q.setValueAtTime(1.4, now);
                        const gain1 = this.audioCtx.createGain();
                        gain1.gain.setValueAtTime(0.001, now);
                        gain1.gain.linearRampToValueAtTime(0.45, now + 0.003);
                        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
                        noise1.connect(filter1);
                        filter1.connect(gain1);
                        gain1.connect(this.audioCtx.destination);
                        noise1.start(now);
                        noise1.stop(now + 0.035);

                        // Golpe mecánico sutil
                        const thudOsc = this.audioCtx.createOscillator();
                        const thudGain = this.audioCtx.createGain();
                        thudOsc.type = 'triangle';
                        thudOsc.frequency.setValueAtTime(160, now);
                        thudOsc.frequency.exponentialRampToValueAtTime(55, now + 0.028);
                        thudGain.gain.setValueAtTime(0.25, now);
                        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                        thudOsc.connect(thudGain);
                        thudGain.connect(this.audioCtx.destination);
                        thudOsc.start(now);
                        thudOsc.stop(now + 0.032);

                        // Cierre del obturador
                        const noise2 = this.audioCtx.createBufferSource();
                        noise2.buffer = noiseBuffer;
                        const filter2 = this.audioCtx.createBiquadFilter();
                        filter2.type = 'bandpass';
                        filter2.frequency.setValueAtTime(2500, now + 0.048);
                        filter2.Q.setValueAtTime(1.8, now + 0.048);
                        const gain2 = this.audioCtx.createGain();
                        gain2.gain.setValueAtTime(0.001, now + 0.048);
                        gain2.gain.linearRampToValueAtTime(0.32, now + 0.052);
                        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
                        noise2.connect(filter2);
                        filter2.connect(gain2);
                        gain2.connect(this.audioCtx.destination);
                        noise2.start(now + 0.048);
                        noise2.stop(now + 0.088);

                        if(navigator.vibrate) navigator.vibrate(80);
                        return;
                    }

                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    if (type === 'click') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                        osc.start(now); osc.stop(now + 0.05);
                    } else if (type === 'tiki') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.02);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                        osc.start(now); osc.stop(now + 0.02);
                    } else if (type === 'error') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                        if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                    }
                } catch(e) {}
            }

            // --- BASE DE DATOS Y ALMACENAMIENTO ---
            async initDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { this.db = request.result; resolve(); };
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
                        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'id', autoIncrement: true });
                        if (!db.objectStoreNames.contains('pending_sessions')) db.createObjectStore('pending_sessions', { keyPath: 'id' });
                    };
                });
            }

            setStorage(key, value) { localStorage.setItem(APP_PREFIX + key, value); }
            getStorage(key) { return localStorage.getItem(APP_PREFIX + key); }
            removeStorage(key) { localStorage.removeItem(APP_PREFIX + key); }

            loadInputsFromStorage() {
                const type = this.getStorage('lastType') || 'Pedido';
                const phrase = this.getStorage('lastPhrase') || 'entregado correctamente';

                this.session.code = '';
                this.updateCodeDisplay();
                document.getElementById('custom-phrase').value = phrase;
                this.selectType(type, Array.from(document.querySelectorAll('.type-option')).find(btn => btn.textContent === type));
            }

            // --- TECLADO NUMÉRICO INTEGRADO ---
            handleInputClick(e) {
                if (this.isScanning) return; 
                this.toggleNumpad();
            }

            toggleNumpad() {
                this.playSound('click');
                const wrapper = document.getElementById('numpad-wrapper');
                wrapper.classList.toggle('open');
            }

            typeDigit(d) {
                this.playSound('tiki');
                if(navigator.vibrate) navigator.vibrate(40);
                if (this.session.code.length < 8) {
                    this.session.code += d;
                    this.updateCodeDisplay();
                }
            }

            deleteDigit() {
                this.playSound('tiki');
                if(navigator.vibrate) navigator.vibrate(40);
                this.session.code = this.session.code.slice(0, -1);
                this.updateCodeDisplay();
            }

            clearDigits() {
                this.playSound('tiki');
                if(navigator.vibrate) navigator.vibrate(40);
                this.session.code = '';
                this.updateCodeDisplay();
            }

            updateCodeDisplay() {
                const display = document.getElementById('code-display');
                display.textContent = this.session.code || '--------';
                display.style.color = this.session.code ? 'var(--text-dark)' : '#DADCE0';
            }

            // --- ENTRADA POR VOZ (8 DÍGITOS) ---
            toggleVoiceInput(e) {
                if (e) e.stopPropagation();
                this.playSound('click');

                if (this.isScanning) this.closeScanner();
                document.getElementById('numpad-wrapper').classList.remove('open');

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    this.playSound('error');
                    this.showToast('Dictado por voz no disponible en este navegador', 'error');
                    return;
                }

                if (this.isListening) {
                    this.stopVoiceInput();
                } else {
                    this.startVoiceInput(SpeechRecognition);
                }
            }

            startVoiceInput(SpeechRecognition) {
                const btn = document.getElementById('voice-input-btn');
                this.isListening = true;
                btn.style.background = 'var(--danger)';
                btn.innerHTML = '<i class="fas fa-stop"></i>';
                this.showToast('Escuchando números...');

                try {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'es-PE';
                    this.recognition.interimResults = true;
                    this.recognition.maxAlternatives = 3;
                    this.recognition.continuous = false;

                    this.recognition.onresult = (event) => {
                        let bestDigits = '';
                        for (let i = 0; i < event.results.length; i++) {
                            const res = event.results[i];
                            let chosen = '';
                            for (let a = 0; a < res.length; a++) {
                                const candidate = this.parseSpokenNumbers(res[a].transcript);
                                if (candidate.length > chosen.length) {
                                    chosen = candidate;
                                }
                            }
                            bestDigits += chosen;
                        }
                        const finalCode = bestDigits.slice(0, 8);
                        if (finalCode.length > 0) {
                            this.session.code = finalCode;
                            this.updateCodeDisplay();
                        }
                        if (finalCode.length >= 8 && event.results[event.results.length - 1].isFinal) {
                            this.stopVoiceInput();
                        }
                    };

                    this.recognition.onerror = (event) => {
                        if (event.error !== 'aborted') {
                            this.playSound('error');
                            this.showToast('No se pudo escuchar con claridad', 'error');
                        }
                        this.resetVoiceBtn();
                    };

                    this.recognition.onend = () => {
                        if (this.isListening) {
                            if (this.session.code.length > 0) {
                                this.playSound('click');
                                if (navigator.vibrate) navigator.vibrate([40, 40]);
                            }
                        }
                        this.resetVoiceBtn();
                    };

                    this.recognition.start();
                } catch (err) {
                    this.resetVoiceBtn();
                    this.showToast('Error al iniciar micrófono', 'error');
                }
            }

            stopVoiceInput() {
                this.isListening = false;
                if (this.recognition) {
                    try { this.recognition.stop(); } catch (e) {}
                }
                this.resetVoiceBtn();
            }

            resetVoiceBtn() {
                this.isListening = false;
                const btn = document.getElementById('voice-input-btn');
                if (btn) {
                    btn.style.background = 'var(--primary)';
                    btn.innerHTML = '<i class="fas fa-microphone"></i>';
                }
            }

            parseSpokenNumbers(text) {
                const normalized = text
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[,.;:!?¿¡\-_/\\()]+/g, ' ')
                    .trim();

                if (!normalized) return '';

                const units = {
                    cero: 0, uno: 1, un: 1, una: 1, dos: 2, tres: 3, cuatro: 4,
                    cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9
                };
                const teens = {
                    diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15,
                    dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19
                };
                const twenties = {
                    veinte: 20, veintiuno: 21, veintiun: 21, veintidos: 22, veintitres: 23,
                    veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27,
                    veintiocho: 28, veintinueve: 29
                };
                const tens = {
                    treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60,
                    setenta: 70, ochenta: 80, noventa: 90
                };
                const hundreds = {
                    cien: 100, ciento: 100, doscientos: 200, trescientos: 300,
                    cuatrocientos: 400, quinientos: 500, seiscientos: 600,
                    setecientos: 700, ochocientos: 800, novecientos: 900
                };

                const tokens = normalized.split(/\s+/);
                let result = '';
                let currentVal = null;
                let hasConnector = false;

                const flush = () => {
                    if (currentVal !== null) {
                        result += String(currentVal);
                        currentVal = null;
                    }
                };

                for (const token of tokens) {
                    if (/^\d+$/.test(token)) {
                        flush();
                        result += token;
                        hasConnector = false;
                        continue;
                    }

                    if (token === 'y') {
                        hasConnector = true;
                        continue;
                    }

                    if (token in hundreds) {
                        const v = hundreds[token];
                        if (currentVal !== null && currentVal >= 1000 && currentVal % 1000 === 0) {
                            currentVal += v;
                        } else {
                            flush();
                            currentVal = v;
                        }
                        hasConnector = false;
                        continue;
                    }

                    if (token in tens) {
                        const v = tens[token];
                        if (currentVal !== null && currentVal >= 100 && currentVal % 100 === 0) {
                            currentVal += v;
                        } else {
                            flush();
                            currentVal = v;
                        }
                        hasConnector = false;
                        continue;
                    }

                    if (token in twenties || token in teens) {
                        const v = twenties[token] ?? teens[token];
                        if (currentVal !== null && currentVal >= 100 && currentVal % 100 === 0) {
                            currentVal += v;
                        } else {
                            flush();
                            currentVal = v;
                        }
                        hasConnector = false;
                        continue;
                    }

                    if (token in units) {
                        const v = units[token];
                        if (hasConnector && currentVal !== null && (currentVal % 100) >= 20 && (currentVal % 10) === 0 && v > 0) {
                            currentVal += v;
                        } else if (!hasConnector && currentVal !== null && currentVal >= 100 && (currentVal % 100 === 0) && v > 0) {
                            currentVal += v;
                        } else {
                            flush();
                            currentVal = v;
                        }
                        hasConnector = false;
                        continue;
                    }

                    if (token === 'mil') {
                        if (currentVal === null || currentVal === 0) {
                            currentVal = 1000;
                        } else {
                            currentVal *= 1000;
                        }
                        hasConnector = false;
                        continue;
                    }

                    hasConnector = false;
                }

                flush();
                return result.replace(/\D/g, '').slice(0, 8);
            }

            // --- ESCÁNER INLINE CON MODO ENFOQUE ---
            async toggleScanner(e) {
                if(e) e.stopPropagation();
                this.playSound('click');
                
                if (this.isScanning) {
                    this.closeScanner();
                    return;
                }

                if (this.isListening) this.stopVoiceInput();
                document.getElementById('numpad-wrapper').classList.remove('open');
                this.isScanning = true;

                const wrapper = document.getElementById('scanner-flex-wrapper');
                const container = document.getElementById('code-input-container');
                const overlay = document.getElementById('global-overlay');
                const floatBtn = document.getElementById('floating-scan-btn');
                const video = document.getElementById('mini-scanner-video');
                const display = document.getElementById('code-display');
                const guide = document.getElementById('scanner-guide');
                const toggleBtn = document.getElementById('toggle-scanner-btn');

                wrapper.classList.add('scanner-active');
                container.classList.add('scanner-active');
                overlay.classList.add('active');
                floatBtn.style.display = 'flex';
                floatBtn.classList.remove('success');
                floatBtn.innerHTML = '<i class="fas fa-camera"></i> Escanear';
                
                display.style.display = 'none';
                video.style.display = 'block';
                guide.style.display = 'block';
                
                toggleBtn.innerHTML = '<i class="fas fa-times"></i>';
                toggleBtn.style.background = 'var(--danger)';

                try {
                    this.scannerStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', advanced: [{ focusMode: 'macro' }] }
                    });
                    video.srcObject = this.scannerStream;
                } catch (err) {
                    this.showToast('Error al abrir cámara', 'error');
                    this.closeScanner();
                }
            }

            async executeScan() {
                if (this.scannedCode) {
                    this.confirmScanner();
                    return;
                }

                this.playSound('shutter');
                if(navigator.vibrate) navigator.vibrate(50);

                const video = document.getElementById('mini-scanner-video');
                const frozenImg = document.getElementById('scanner-frozen-img');
                const flash = document.getElementById('scanner-flash');
                const overlay = document.getElementById('scanner-overlay');
                const floatBtn = document.getElementById('floating-scan-btn');

                // Efecto Flash
                flash.style.display = 'block';
                flash.style.opacity = '1';
                setTimeout(() => { flash.style.opacity = '0'; setTimeout(()=>flash.style.display='none', 100); }, 50);

                // Congelar Imagen
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                frozenImg.src = canvas.toDataURL('image/jpeg');
                frozenImg.style.display = 'block';
                video.style.display = 'none';

                overlay.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                overlay.style.display = 'flex';

                // Procesar OCR sobre la imagen congelada
                if ('TextDetector' in window) {
                    try {
                        const detector = new TextDetector();
                        const texts = await detector.detect(canvas);
                        let found = false;
                        for (const text of texts) {
                            const match = text.rawValue.match(/\d{8}/);
                            if (match) {
                                this.processScannedCode(match[0]);
                                found = true;
                                break;
                            }
                        }
                        if (!found) this.handleScanFail();
                    } catch(err) {
                        this.handleScanFail();
                    }
                } else {
                    this.fallbackScan(canvas);
                }
            }

            loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }

            async fallbackScan(canvas) {
                try {
                    if (!window.Tesseract) {
                        await this.loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
                    }
                    const result = await Tesseract.recognize(canvas, 'eng');
                    const match = result.data.text.match(/\d{8}/);
                    if (match) {
                        this.processScannedCode(match[0]);
                    } else {
                        this.handleScanFail();
                    }
                } catch (err) {
                    this.handleScanFail();
                }
            }

            processScannedCode(code) {
                const overlay = document.getElementById('scanner-overlay');
                const floatBtn = document.getElementById('floating-scan-btn');
                
                overlay.textContent = code;
                overlay.style.display = 'flex';
                
                floatBtn.classList.add('success');
                floatBtn.innerHTML = '<i class="fas fa-check"></i> Confirmar';
                
                this.scannedCode = code;
                if(navigator.vibrate) navigator.vibrate([50, 50]);
            }

            handleScanFail() {
                this.showToast('No se detectaron 8 dígitos', 'error');
                // Descongelar y restaurar
                document.getElementById('scanner-frozen-img').style.display = 'none';
                document.getElementById('mini-scanner-video').style.display = 'block';
                document.getElementById('scanner-overlay').style.display = 'none';
            }

            confirmScanner() {
                this.playSound('click');
                if (this.scannedCode) {
                    this.session.code = this.scannedCode;
                    this.updateCodeDisplay();
                }
                this.closeScanner();
            }

            closeScanner() {
                this.isScanning = false;
                this.scannedCode = null;
                
                if (this.scannerStream) {
                    this.scannerStream.getTracks().forEach(t => t.stop());
                    this.scannerStream = null;
                }

                document.getElementById('scanner-flex-wrapper').classList.remove('scanner-active');
                document.getElementById('code-input-container').classList.remove('scanner-active');
                document.getElementById('global-overlay').classList.remove('active');
                document.getElementById('floating-scan-btn').style.display = 'none';
                
                document.getElementById('mini-scanner-video').style.display = 'none';
                document.getElementById('scanner-frozen-img').style.display = 'none';
                document.getElementById('scanner-overlay').style.display = 'none';
                document.getElementById('scanner-guide').style.display = 'none';
                document.getElementById('code-display').style.display = 'block';
                
                const toggleBtn = document.getElementById('toggle-scanner-btn');
                toggleBtn.innerHTML = '<i class="fas fa-camera"></i>';
                toggleBtn.style.background = 'var(--primary)';
            }

            // --- CARPETA LOCAL ---
            async selectDirectory(forceChange = false) {
                this.playSound('click');
                if (!window.showDirectoryPicker) {
                    this.showToast('Navegador no soporta carpeta automática.', 'error');
                    return;
                }
                try {
                    this.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    const tx = this.db.transaction('settings', 'readwrite');
                    tx.objectStore('settings').put({ id: 'dirHandle', handle: this.dirHandle });
                    this.showToast('Carpeta vinculada correctamente');
                    this.cleanupOldPhotos();
                } catch (e) { }
            }

            async verifyDirectoryPermission() {
                if (!this.dirHandle) {
                    return new Promise((resolve) => {
                        const tx = this.db.transaction(['settings'], 'readonly');
                        const req = tx.objectStore('settings').get('dirHandle');
                        req.onsuccess = async () => {
                            if (req.result && req.result.handle) {
                                this.dirHandle = req.result.handle;
                                try {
                                    const perm = await this.dirHandle.queryPermission({ mode: 'readwrite' });
                                    if (perm === 'granted') {
                                        resolve(true);
                                    } else {
                                        const requestPerm = await this.dirHandle.requestPermission({ mode: 'readwrite' });
                                        resolve(requestPerm === 'granted');
                                    }
                                } catch(e) { resolve(false); }
                            } else resolve(false);
                        };
                        req.onerror = () => resolve(false);
                    });
                } else {
                    try {
                        const perm = await this.dirHandle.queryPermission({ mode: 'readwrite' });
                        if (perm === 'granted') return true;
                        return (await this.dirHandle.requestPermission({ mode: 'readwrite' })) === 'granted';
                    } catch(e) { return false; }
                }
            }

            async cleanupOldPhotos() {
                if (!this.dirHandle) return;
                try {
                    const now = Date.now();
                    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
                    for await (const entry of this.dirHandle.values()) {
                        if (entry.kind === 'file' && entry.name.endsWith('.jpg')) {
                            const file = await entry.getFile();
                            if (now - file.lastModified > THIRTY_DAYS_MS) {
                                await this.dirHandle.removeEntry(entry.name);
                            }
                        }
                    }
                } catch (err) {}
            }

            // --- SESIONES PENDIENTES ---
            async checkAndRestorePendingSession() {
                try {
                    const tx = this.db.transaction(['photos'], 'readonly');
                    const store = tx.objectStore('photos');
                    const countReq = store.count();
                    
                    countReq.onsuccess = () => {
                        if (countReq.result > 0) {
                            this.session.code = this.getStorage('session_code') || '';
                            this.session.type = this.getStorage('session_type') || 'Pedido';
                            this.session.phrase = this.getStorage('session_phrase') || 'entregado correctamente';
                            
                            this.showLoading(true, "Restaurando captura en curso...");
                            
                            const getAllReq = store.getAll();
                            getAllReq.onsuccess = async () => {
                                this.photos = getAllReq.result.map(item => ({
                                    id: item.id, blob: item.blob, url: URL.createObjectURL(item.blob), isProcessing: false
                                }));
                                this.showLoading(false);
                                this.goToGallery();
                            };
                        }
                    };
                } catch (e) {}
            }

            renderPendingSessions() {
                const tx = this.db.transaction('pending_sessions', 'readonly');
                const req = tx.objectStore('pending_sessions').getAll();
                req.onsuccess = () => {
                    const sessions = req.result.reverse();
                    const container = document.getElementById('pending-sessions-list');
                    
                    if (sessions.length === 0) {
                        container.innerHTML = '';
                        return;
                    }

                    let html = `<label style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px;">Sesiones Pendientes (${sessions.length}/5)</label>`;
                    
                    sessions.forEach(s => {
                        html += `
                            <div class="history-card" onclick="app.resumePendingSession('${s.id}')" style="position: relative; overflow: hidden; border-left: 4px solid var(--primary);">
                                <div style="flex: 1;">
                                    <strong>${s.type} ${s.code}</strong>
                                    <small>${s.photos.length} foto(s) • ${new Date(s.date).toLocaleString('es-PE', { hour:'2-digit', minute:'2-digit' })}</small>
                                </div>
                                <button onclick="app.deletePendingSession('${s.id}', event)" style="background: var(--danger); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(217,48,37,0.3);">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                };
            }

            async checkCodeInPending(code) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction('pending_sessions', 'readonly');
                    const req = tx.objectStore('pending_sessions').getAll();
                    req.onsuccess = () => {
                        const found = req.result.find(s => s.code === code);
                        resolve(found);
                    };
                });
            }

            async getPendingCount() {
                return new Promise((resolve) => {
                    const tx = this.db.transaction('pending_sessions', 'readonly');
                    const req = tx.objectStore('pending_sessions').count();
                    req.onsuccess = () => resolve(req.result);
                });
            }

            async savePendingSession() {
                return new Promise((resolve) => {
                    const sessionToSave = {
                        id: Date.now().toString(),
                        code: this.session.code,
                        type: this.session.type,
                        phrase: this.session.phrase,
                        photos: this.photos.filter(p => p.blob).map(p => p.blob),
                        date: Date.now()
                    };
                    const tx = this.db.transaction(['pending_sessions', 'photos'], 'readwrite');
                    tx.objectStore('pending_sessions').add(sessionToSave);
                    tx.objectStore('photos').clear(); 
                    tx.oncomplete = () => {
                        this.photos.forEach(p => { if(p.url) URL.revokeObjectURL(p.url); });
                        this.photos = [];
                        resolve();
                    };
                });
            }

            async resumePendingSession(id) {
                this.playSound('click');
                this.showLoading(true, "Cargando sesión...");
                const tx = this.db.transaction(['pending_sessions', 'photos'], 'readwrite');
                const pendingStore = tx.objectStore('pending_sessions');
                const photoStore = tx.objectStore('photos');
                
                const req = pendingStore.get(id);
                req.onsuccess = () => {
                    const sessionData = req.result;
                    if (!sessionData) return this.showLoading(false);
                    
                    this.session.code = sessionData.code;
                    this.session.type = sessionData.type;
                    this.session.phrase = sessionData.phrase;
                    this.setStorage('session_code', this.session.code);
                    this.setStorage('session_type', this.session.type);
                    this.setStorage('session_phrase', this.session.phrase);
                    
                    photoStore.clear();
                    this.photos = [];
                    
                    let addedCount = 0;
                    sessionData.photos.forEach(blob => {
                        const addReq = photoStore.add({ blob });
                        addReq.onsuccess = (e) => {
                            this.photos.push({ id: e.target.result, blob, url: URL.createObjectURL(blob), isProcessing: false });
                            addedCount++;
                            if (addedCount === sessionData.photos.length) {
                                pendingStore.delete(id);
                                this.showLoading(false);
                                this.openCameraView();
                            }
                        };
                    });
                };
            }

            deletePendingSession(id, event) {
                event.stopPropagation();
                this.playSound('error');
                if (confirm('¿Estás seguro de que deseas eliminar esta sesión? Las fotos tomadas se perderán.')) {
                    const tx = this.db.transaction('pending_sessions', 'readwrite');
                    tx.objectStore('pending_sessions').delete(id);
                    tx.oncomplete = () => {
                        this.renderPendingSessions();
                        this.showToast('Sesión eliminada');
                    };
                }
            }

            // --- INICIO DE SESIÓN NUEVA ---
            async startSession(isHD) {
                this.playSound('click');
                if (this.isListening) this.stopVoiceInput();
                if (this.session.code.length === 0) {
                    this.playSound('error');
                    this.showToast('Ingresa un código válido', 'error');
                    return;
                }

                const existingSession = await this.checkCodeInPending(this.session.code);
                if (existingSession) {
                    this.playSound('error');
                    if (confirm(`⚠️ ALERTA: Tienes una sesión PENDIENTE con el código #${this.session.code}.\n\n¿Deseas reanudarla en lugar de crear una nueva?`)) {
                        this.resumePendingSession(existingSession.id);
                        return;
                    } else {
                        return; 
                    }
                }

                if (window.showDirectoryPicker) {
                    let hasPermission = await this.verifyDirectoryPermission();
                    if (!hasPermission) {
                        this.showToast('Requiere permisos de guardado', 'info');
                        await this.selectDirectory();
                    } else {
                        this.cleanupOldPhotos();
                    }
                }

                this.setStorage('lastType', this.session.type);
                this.setStorage('lastPhrase', document.getElementById('custom-phrase').value);

                this.session.phrase = document.getElementById('custom-phrase').value;
                this.setStorage('session_code', this.session.code);
                this.setStorage('session_type', this.session.type);
                this.setStorage('session_phrase', this.session.phrase);

                this.hdMode = isHD;
                document.getElementById('hd-btn').classList.toggle('active', this.hdMode);

                await this.clearDB(); 
                this.photos = [];
                this.currentZoom = 1;
                this.openCameraView();
            }

            selectType(type, btn) {
                this.playSound('click');
                if(!btn) return;
                this.session.type = type;
                document.querySelectorAll('.type-option').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            // --- ZOOM TÁCTIL (Pinch-to-zoom) ---
            setupZoomListeners() {
                const preview = document.getElementById('camera-preview');
                preview.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        this.initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    }
                }, { passive: false });

                preview.addEventListener('touchmove', async (e) => {
                    if (e.touches.length === 2 && this.initialDistance) {
                        e.preventDefault(); 
                        const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                        const scale = currentDistance / this.initialDistance;
                        
                        if (this.stream) {
                            const track = this.stream.getVideoTracks()[0];
                            const capabilities = track.getCapabilities();
                            if (capabilities.zoom) {
                                const min = capabilities.zoom.min;
                                const max = capabilities.zoom.max;
                                let newZoom = this.currentZoom * scale;
                                newZoom = Math.max(min, Math.min(newZoom, max));
                                
                                try {
                                    await track.applyConstraints({ advanced: [{ zoom: newZoom }] });
                                    this.currentZoom = newZoom;
                                } catch (err) {}
                            }
                        }
                        this.initialDistance = currentDistance;
                    }
                }, { passive: false });
            }

            // --- VISOR PANTALLA COMPLETA SWIPE ---
            setupSwipeListeners() {
                const touchArea = document.getElementById('fs-touch-area');
                touchArea.addEventListener('touchstart', e => {
                    this.touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                touchArea.addEventListener('touchend', e => {
                    const touchEndX = e.changedTouches[0].screenX;
                    const deltaX = this.touchStartX - touchEndX;
                    if (deltaX > 50) this.nextFullscreen();
                    else if (deltaX < -50) this.prevFullscreen();
                }, { passive: true });
            }

            openFullscreenViewer(index, mode = 'current') {
                this.playSound('click');
                if (mode === 'current') {
                    this.fsUrls = this.photos.filter(p => !p.isProcessing).map(p => p.url);
                }
                
                this.fsIndex = index;
                document.getElementById('fullscreen-viewer').style.display = 'flex';
                this.updateFullscreenImg();
            }

            updateFullscreenImg() {
                const img = document.getElementById('fs-img');
                const counter = document.getElementById('fs-counter');
                img.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    img.src = this.fsUrls[this.fsIndex];
                    img.style.transform = 'scale(1)';
                }, 50);
                counter.textContent = `${this.fsIndex + 1} / ${this.fsUrls.length}`;
            }

            nextFullscreen() {
                if (this.fsIndex < this.fsUrls.length - 1) {
                    this.playSound('click');
                    this.fsIndex++;
                    this.updateFullscreenImg();
                }
            }

            prevFullscreen() {
                if (this.fsIndex > 0) {
                    this.playSound('click');
                    this.fsIndex--;
                    this.updateFullscreenImg();
                }
            }

            closeFullscreenViewer() {
                this.playSound('click');
                document.getElementById('fullscreen-viewer').style.display = 'none';
                document.getElementById('fs-img').src = '';
            }

            // --- CÁMARA ---
            async openCameraView() {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('gallery-screen').style.display = 'none';
                document.getElementById('camera-app').style.display = 'block';

                document.getElementById('camera-code-display').textContent = this.session.code;
                document.getElementById('camera-type-display').textContent = this.session.type;
                
                this.updateCameraUI();
                await this.initCamera();
            }

            async initCamera() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                const constraints = { 
                    video: { 
                        facingMode: this.facingMode, 
                        width: { ideal: this.hdMode ? 2560 : 1920 }, 
                        height: { ideal: this.hdMode ? 1440 : 1080 },
                        frameRate: { ideal: 30 }
                    } 
                };
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    document.getElementById('video').srcObject = this.stream;
                    const track = this.stream.getVideoTracks()[0];
                    if (track.getCapabilities().zoom) this.currentZoom = track.getSettings().zoom || 1;
                    if (track.getCapabilities().torch && this.flashMode === 'torch') {
                        track.applyConstraints({ advanced: [{ torch: true }] }).catch(()=>{});
                    }
                } catch (e) {
                    this.playSound('error');
                    this.showToast('Error de cámara', 'error');
                }
            }

            toggleHD() {
                this.playSound('click');
                this.hdMode = !this.hdMode;
                document.getElementById('hd-btn').classList.toggle('active', this.hdMode);
                this.initCamera();
            }

            async toggleFlash() {
                this.playSound('click');
                if (!this.stream) return;
                const track = this.stream.getVideoTracks()[0];
                if (!track.getCapabilities().torch) return this.showToast('Flash no disponible');
                
                if (this.flashMode === 'off') {
                    this.flashMode = 'torch';
                    document.getElementById('flash-btn').innerHTML = '<i class="fas fa-lightbulb"></i>';
                    document.getElementById('flash-btn').classList.add('active');
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                } else {
                    this.flashMode = 'off';
                    document.getElementById('flash-btn').innerHTML = '<i class="fas fa-bolt" style="opacity:0.4"></i>';
                    document.getElementById('flash-btn').classList.remove('active');
                    await track.applyConstraints({ advanced: [{ torch: false }] });
                }
            }

            flipCamera() {
                this.playSound('click');
                this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
                this.initCamera();
            }

            async takePhoto() {
                this.playSound('shutter');

                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                
                if (this.facingMode === 'user') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                
                ctx.filter = 'saturate(115%) contrast(105%)';
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(video, 0, 0);
                
                ctx.filter = 'none';
                
                this.drawWatermark(ctx, canvas.width, canvas.height);
                
                // DESTELLO INMEDIATO PARA AVISAR QUE YA SE TOMÓ LA FOTO
                const flash = document.getElementById('flash-overlay');
                flash.style.opacity = '1';
                setTimeout(() => flash.style.opacity = '0', 100);
                
                // INDICADOR DE CARGA INMEDIATO EN LA MINIATURA
                const tempId = 'temp_' + Date.now();
                this.photos.push({ id: tempId, url: null, isProcessing: true });
                this.updateCameraUI();
                
                // PROCESAMIENTO ASÍNCRONO DEL BLOB
                canvas.toBlob(async (blob) => {
                    const tempUrl = URL.createObjectURL(blob);
                    
                    // Actualizar el objeto temporal con la imagen real
                    const photoIndex = this.photos.findIndex(p => p.id === tempId);
                    if (photoIndex !== -1) {
                        this.photos[photoIndex].blob = blob;
                        this.photos[photoIndex].url = tempUrl;
                        this.photos[photoIndex].isProcessing = false;
                        this.updateCameraUI();
                    }

                    if (this.dirHandle) {
                        try {
                            const now = new Date();
                            const pad = (n) => String(n).padStart(2, '0');
                            const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
                            const filename = `${this.session.code}_${dateStr}.jpg`;
                            
                            const fileHandle = await this.dirHandle.getFileHandle(filename, { create: true });
                            const writable = await fileHandle.createWritable();
                            await writable.write(blob);
                            await writable.close();
                        } catch (err) {}
                    }

                    const photoData = { blob: blob };
                    const tx = this.db.transaction(['photos'], 'readwrite');
                    const store = tx.objectStore('photos');
                    const request = store.add(photoData);
                    
                    request.onsuccess = () => {
                        if (photoIndex !== -1) {
                            this.photos[photoIndex].id = request.result;
                        }
                    };
                }, 'image/jpeg', 1.0);
            }

            drawWatermark(ctx, width, height) {
                const now = new Date();
                const text1 = `${this.session.type.toUpperCase()} ${this.session.code}`;
                const text2 = `${now.toLocaleDateString('es-PE')} ${now.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })}`;
                
                const baseSize = Math.min(width, height);
                const sizeL = Math.max(16, Math.floor(baseSize * 0.025));
                const sizeS = Math.max(12, Math.floor(baseSize * 0.018));
                const pad = Math.floor(baseSize * 0.025);
                
                ctx.font = `bold ${sizeL}px sans-serif`;
                const w1 = ctx.measureText(text1).width;
                ctx.font = `${sizeS}px sans-serif`;
                const w2 = ctx.measureText(text2).width;
                
                const bgW = Math.max(w1, w2) + (pad * 1.5);
                const bgH = (sizeL * 1.3 * 2) + (pad * 0.8);
                const bgX = pad - (pad * 0.5);
                const bgY = height - pad - bgH + (pad * 0.3);
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.roundRect(bgX, bgY, bgW, bgH, 8); ctx.fill();
                
                ctx.fillStyle = '#FFF';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.font = `bold ${sizeL}px sans-serif`;
                ctx.fillText(text1, pad, height - pad - (sizeL * 1.3) + (sizeL * 0.2));
                
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = `${sizeS}px sans-serif`;
                ctx.fillText(text2, pad, height - pad);
            }

            updateCameraUI() {
                const container = document.getElementById('camera-thumbnails');
                container.innerHTML = '';
                this.photos.forEach((p, idx) => {
                    const div = document.createElement('div');
                    div.className = 'thumb';
                    if (p.isProcessing) {
                        div.innerHTML = `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.2);"><i class="fas fa-spinner fa-spin" style="color:white; font-size: 20px;"></i></div>`;
                    } else {
                        div.innerHTML = `<img src="${p.url}">`;
                        div.onclick = () => this.openFullscreenViewer(idx, 'current');
                    }
                    container.appendChild(div);
                });
                container.scrollLeft = container.scrollWidth;
                document.getElementById('to-gallery-btn').disabled = this.photos.length === 0;
            }

            // --- GALERÍA Y COMPARTIR ---
            goToGallery() {
                this.playSound('click');
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                
                document.getElementById('camera-app').style.display = 'none';
                document.getElementById('gallery-screen').style.display = 'flex';
                document.getElementById('gallery-subtitle').textContent = `${this.photos.length} foto(s) del ${this.session.type} ${this.session.code}`;
                
                const msgField = document.getElementById('review-message');
                msgField.value = `${this.session.type} manual ${this.session.phrase}\n${this.session.code}`;
                
                this.renderGalleryGrid();
            }

            renderGalleryGrid() {
                const grid = document.getElementById('gallery-grid');
                grid.innerHTML = '';
                this.photos.forEach((photo, index) => {
                    if (photo.isProcessing) return;
                    const div = document.createElement('div');
                    div.className = 'photo-card';
                    div.onclick = () => this.openFullscreenViewer(index, 'current');
                    div.innerHTML = `
                        <img src="${photo.url}">
                        <button class="delete-photo-btn" onclick="app.deletePhoto(${index}, event)"><i class="fas fa-trash"></i></button>
                    `;
                    grid.appendChild(div);
                });
                if(this.photos.length === 0) this.backToCamera();
            }

            deletePhoto(index, event) {
                event.stopPropagation();
                this.playSound('error');
                const photo = this.photos[index];
                const tx = this.db.transaction(['photos'], 'readwrite');
                tx.objectStore('photos').delete(photo.id);
                URL.revokeObjectURL(photo.url);
                this.photos.splice(index, 1);
                this.renderGalleryGrid();
            }

            backToCamera() { 
                this.playSound('click');
                this.openCameraView(); 
            }

            async goHomeFromGallery() {
                this.playSound('click');
                if (this.photos.length > 0) {
                    const pendingCount = await this.getPendingCount();
                    if (pendingCount >= 5) {
                        this.playSound('error');
                        this.showToast('Límite de 5 sesiones. Envía una antes de pausar otra.', 'error');
                        return;
                    }
                    await this.savePendingSession();
                    this.showToast('Sesión pausada en pantalla principal');
                }

                this.removeStorage('session_code');
                this.removeStorage('session_type');
                this.removeStorage('session_phrase');

                document.getElementById('gallery-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                this.session.code = '';
                this.updateCodeDisplay();
                this.renderPendingSessions();
            }

            async executeShare() {
                if (this.photos.length === 0) return;
                this.playSound('click');
                this.showLoading(true, "Procesando envío...");
                const finalMessage = document.getElementById('review-message').value;
                
                try {
                    try {
                        await navigator.clipboard.writeText(finalMessage);
                        this.showToast("Mensaje copiado. Pégalo al enviar.", "success");
                    } catch (err) {}

                    if (navigator.share && navigator.canShare) {
                        const files = this.photos.map((p, i) => new File([p.blob], `Evidencia_${this.session.code}_${i+1}.jpg`, { type: 'image/jpeg' }));
                        const shareData = { files };
                        if (navigator.canShare(shareData)) {
                            await navigator.share(shareData);
                            this.finalizeAndReset();
                            return;
                        }
                    }
                    const text = encodeURIComponent(finalMessage);
                    window.open(`https://wa.me/?text=${text}`, '_blank');
                    this.finalizeAndReset();
                } catch (e) {
                    this.showLoading(false);
                }
            }

            // --- HISTORIAL Y REINICIO ---
            async finalizeAndReset() {
                const record = {
                    code: this.session.code,
                    type: this.session.type,
                    date: new Date().toISOString(),
                    photoCount: this.photos.length
                };
                const txHistory = this.db.transaction('history', 'readwrite');
                txHistory.objectStore('history').add(record);

                await this.clearDB();
                
                this.removeStorage('session_code');
                this.removeStorage('session_type');
                this.removeStorage('session_phrase');
                
                this.photos.forEach(p => { if(p.url) URL.revokeObjectURL(p.url); });
                this.photos = [];
                
                this.hdMode = false;
                this.flashMode = 'off';
                document.getElementById('hd-btn').classList.remove('active');
                document.getElementById('flash-btn').innerHTML = '<i class="fas fa-bolt" style="opacity:0.4"></i>';
                document.getElementById('flash-btn').classList.remove('active');
                if (this.stream) {
                    const track = this.stream.getVideoTracks()[0];
                    if (track && track.getCapabilities().torch) {
                        track.applyConstraints({ advanced: [{ torch: false }] }).catch(()=>{});
                    }
                }

                setTimeout(() => {
                    this.showLoading(false);
                    this.showToast("Envío exitoso", "success");
                    
                    document.getElementById('gallery-screen').style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                    
                    this.renderPendingSessions();
                    
                    this.session.code = '';
                    this.updateCodeDisplay();
                }, 800);
            }

            openHistory() {
                this.playSound('click');
                const tx = this.db.transaction('history', 'readonly');
                const req = tx.objectStore('history').getAll();
                req.onsuccess = () => {
                    const history = req.result.reverse(); 
                    const list = document.getElementById('history-list');
                    if (history.length === 0) {
                        list.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: var(--text-secondary);">Sin envíos recientes.</div>`;
                    } else {
                        // Agrupar por fecha
                        const grouped = {};
                        history.forEach(h => {
                            const d = new Date(h.date);
                            const dateStr = d.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
                            if (!grouped[dateStr]) grouped[dateStr] = [];
                            grouped[dateStr].push(h);
                        });

                        let html = '';
                        const todayStr = new Date().toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });

                        for (const [date, items] of Object.entries(grouped)) {
                            const isTodayGroup = date === todayStr;
                            html += `<div class="history-date-header">${isTodayGroup ? 'Hoy' : date}</div>`;
                            
                            items.forEach(h => {
                                const isCaso = h.type === 'Caso';
                                html += `
                                <div class="history-card ${isCaso ? 'caso' : ''}">
                                    <div style="display:flex; align-items:center; gap:12px;">
                                        <input type="checkbox" class="history-cb" value="${h.code}" data-type="${h.type}" ${isTodayGroup ? 'checked' : ''} style="width:18px; height:18px; accent-color:var(--primary);">
                                        <div>
                                            <strong>${h.type} <span onclick="app.copySingleCode('${h.code}', '${h.type}')" style="cursor:pointer; text-decoration:underline; color:var(--primary);">${h.code}</span></strong>
                                            <small>${new Date(h.date).toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' })}</small>
                                        </div>
                                    </div>
                                    <div style="display:flex; gap:8px; align-items:center;">
                                        <button onclick="app.viewHistoryPhotos('${h.code}', '${h.date}')" class="history-badge" style="border:none; cursor:pointer;">${h.photoCount} <i class="fas fa-camera"></i></button>
                                        <button onclick="app.deleteHistoryRecord(${h.id}, '${h.code}', '${h.date}', event)" style="background:var(--danger); color:white; border:none; border-radius:8px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 4px rgba(217,48,37,0.2);"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>`;
                            });
                        }
                        list.innerHTML = html;
                    }
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('history-screen').style.display = 'flex';
                };
            }

            closeHistory() {
                this.playSound('click');
                document.getElementById('history-screen').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            }

            async viewHistoryPhotos(code, dateIso) {
                this.playSound('click');
                let hasPerm = await this.verifyDirectoryPermission();
                if (!hasPerm) {
                    this.showToast('Selecciona la carpeta local primero', 'info');
                    await this.selectDirectory();
                    return;
                }
                this.showLoading(true, 'Cargando fotos...');
                try {
                    const targetDate = new Date(dateIso);
                    const pad = (n) => String(n).padStart(2, '0');
                    const datePrefix = `${targetDate.getFullYear()}-${pad(targetDate.getMonth()+1)}-${pad(targetDate.getDate())}`;
                    
                    let allUrls = [];
                    let indexCount = 0;
                    let html = '';

                    for await (const entry of this.dirHandle.values()) {
                        if (entry.kind === 'file' && entry.name.startsWith(`${code}_${datePrefix}`)) {
                            const file = await entry.getFile();
                            const url = URL.createObjectURL(file);
                            allUrls.push(url);
                            html += `<div onclick="app.openFullscreenViewer(${indexCount}, 'local')" style="aspect-ratio:3/4; border-radius:10px; overflow:hidden; border:1px solid #E8EAED; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.05);">
                                        <img src="${url}" style="width:100%; height:100%; object-fit:cover;">
                                     </div>`;
                            indexCount++;
                        }
                    }
                    
                    this.fsUrls = allUrls;
                    if (allUrls.length === 0) {
                        this.showToast('No se encontraron fotos locales', 'error');
                        this.showLoading(false);
                        return;
                    }

                    document.getElementById('modal-history-grid').innerHTML = html;
                    document.getElementById('modal-history-title').textContent = `Fotos de ${code}`;
                    document.getElementById('modal-history-subtitle').textContent = targetDate.toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
                    document.getElementById('history-photo-modal').style.display = 'flex';
                    this.showLoading(false);
                } catch (e) {
                    this.showLoading(false);
                    this.showToast('Error al leer fotos', 'error');
                }
            }

            closeHistoryModal() {
                this.playSound('click');
                document.getElementById('history-photo-modal').style.display = 'none';
            }

            async deleteHistoryRecord(id, code, dateIso, event) {
                event.stopPropagation();
                this.playSound('error');
                if (confirm(`¿Eliminar el registro ${code} y sus fotos del almacenamiento local?`)) {
                    this.showLoading(true, 'Eliminando...');
                    
                    const tx = this.db.transaction('history', 'readwrite');
                    tx.objectStore('history').delete(id);
                    
                    if (this.dirHandle) {
                        try {
                            let hasPerm = await this.verifyDirectoryPermission();
                            if (hasPerm) {
                                const targetDate = new Date(dateIso);
                                const pad = (n) => String(n).padStart(2, '0');
                                const datePrefix = `${targetDate.getFullYear()}-${pad(targetDate.getMonth()+1)}-${pad(targetDate.getDate())}`;
                                
                                for await (const entry of this.dirHandle.values()) {
                                    if (entry.kind === 'file' && entry.name.startsWith(`${code}_${datePrefix}`)) {
                                        await this.dirHandle.removeEntry(entry.name);
                                    }
                                }
                            }
                        } catch(e) {}
                    }
                    
                    this.showLoading(false);
                    this.showToast('Registro eliminado');
                    this.openHistory(); 
                }
            }

            copySingleCode(code, type) {
                this.playSound('click');
                const finalCode = type === 'Caso' ? code + 'c' : code;
                navigator.clipboard.writeText(finalCode).then(() => {
                    this.showToast(`Código ${finalCode} copiado`);
                });
            }

            copySelectedCodes() {
                this.playSound('click');
                const checkboxes = document.querySelectorAll('.history-cb:checked');
                if (checkboxes.length === 0) {
                    this.showToast('No hay códigos seleccionados', 'error');
                    return;
                }
                const codes = Array.from(checkboxes).map(cb => {
                    const code = cb.value;
                    const type = cb.getAttribute('data-type');
                    return type === 'Caso' ? code + 'c' : code;
                });
                navigator.clipboard.writeText(codes.join('\n')).then(() => {
                    this.showToast(`${codes.length} códigos copiados`);
                });
            }

            // --- UTILIDADES ---
            async clearDB() {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(['photos'], 'readwrite');
                    tx.objectStore('photos').clear();
                    tx.oncomplete = () => resolve();
                });
            }

            async goHomeFromCamera() {
                this.playSound('click');
                if (this.photos.length > 0) {
                    const pendingCount = await this.getPendingCount();
                    if (pendingCount >= 5) {
                        this.playSound('error');
                        this.showToast('Límite de 5 sesiones. Envía una antes de pausar otra.', 'error');
                        return; 
                    }
                    await this.savePendingSession();
                }
                
                if(this.stream) {
                    const track = this.stream.getVideoTracks()[0];
                    if (track && track.getCapabilities().torch) {
                        track.applyConstraints({ advanced: [{ torch: false }] }).catch(()=>{});
                    }
                    this.stream.getTracks().forEach(t=>t.stop());
                }
                document.getElementById('camera-app').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                this.renderPendingSessions();
            }

            async confirmReset() {
                this.playSound('error');
                if(confirm("¿Eliminar todas las capturas pendientes y resetear la aplicación?")) {
                    await this.clearDB();
                    const tx = this.db.transaction('pending_sessions', 'readwrite');
                    tx.objectStore('pending_sessions').clear();
                    
                    this.removeStorage('session_code');
                    this.removeStorage('session_type');
                    this.removeStorage('session_phrase');
                    this.photos.forEach(p => { if(p.url) URL.revokeObjectURL(p.url); });
                    this.photos = [];
                    this.renderPendingSessions();
                    this.showToast("Aplicación reseteada");
                    this.session.code = '';
                    this.updateCodeDisplay();
                }
            }

            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            showLoading(show, text = "Cargando...") {
                document.getElementById('loading-text').textContent = text;
                document.getElementById('loading').classList.toggle('active', show);
            }
        }

        const app = new ManualesCamApp();
    </script>
</body>
</html>
